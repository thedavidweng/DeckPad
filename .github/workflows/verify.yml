name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: 'python -m pip install --only-binary=:all: ruff==0.17.3'
      - run: python -m ruff check main.py py_modules/deckpad tests
      - run: python -m compileall -q main.py py_modules/deckpad tests
      - run: python -m unittest discover -s tests -t .

  frontend-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          check-latest: true
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      - name: Package README inputs and summarize
        shell: bash
        run: |
          mkdir -p out/DeckPad
          cp -r dist py_modules main.py package.json plugin.json LICENSE README.md out/DeckPad/
          (cd out && zip -qr DeckPad.zip DeckPad -x '*/__pycache__/*')
          python3 scripts/package-summary.py out/DeckPad.zip | tee package-summary.md
          cat package-summary.md >> "$GITHUB_STEP_SUMMARY"
      # Match the CLI version used by decky-plugin-database's build-plugins.yml.
      - name: Build with official Decky CLI
        run: |
          curl --fail --location https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64 --output "$RUNNER_TEMP/decky-cli"
          echo "0d0f8c127cd3dba12b75f771c786194ca9f4f771b4787ae24de8b1af45af4294  $RUNNER_TEMP/decky-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/decky-cli"
          "$RUNNER_TEMP/decky-cli" plugin build -o /tmp/deckpad-package .
      - run: python -m tests.check_package /tmp/deckpad-package/DeckPad.zip
