name: Verify plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: python -m pip install ruff==0.15.0
      - run: python -m ruff check main.py py_modules/deckpad tests
      - run: python -m compileall -q main.py py_modules/deckpad tests
      - run: python -m unittest discover -s tests -t .

  frontend-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      # Match the CLI version used by decky-plugin-database's build-plugins.yml.
      - name: Build with official Decky CLI
        run: |
          curl --fail --location https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64 --output /tmp/decky
          chmod +x /tmp/decky
          /tmp/decky plugin build -b -o /tmp/deckpad-package .
      - run: python -m tests.check_package /tmp/deckpad-package/DeckPad.zip
