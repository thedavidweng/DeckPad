<!doctype html>
<!--
  Source of site/og-image.png, the social preview for the website and the GitHub repository.
  Render at 1280x640 (GitHub's recommended social preview size), from the repository root:
    npx playwright screenshot --viewport-size "1280, 640" --wait-for-timeout 1500 \
      "file://$PWD/docs/og-image/index.html" site/og-image.png
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1280px;
      height: 640px;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      background:
        radial-gradient(520px 420px at 77% 46%, rgba(26, 159, 255, 0.22), transparent 70%),
        radial-gradient(620px 380px at 100% 100%, rgba(64, 175, 168, 0.20), transparent 70%),
        linear-gradient(160deg, #141b25 0%, #0b0f15 55%, #07090d 100%);
      color: #fff;
      font-family: Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .rings {
      position: absolute;
      top: 320px;
      left: 985px;
    }

    .rings span {
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .rings span:nth-child(1) { width: 640px; height: 640px; }
    .rings span:nth-child(2) { width: 860px; height: 860px; border-color: rgba(255, 255, 255, 0.05); }
    .rings span:nth-child(3) { width: 1080px; height: 1080px; border-color: rgba(255, 255, 255, 0.03); }

    .copy {
      position: relative;
      z-index: 1;
      width: 680px;
      margin-left: 88px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: Montserrat, Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand img {
      width: 64px;
      height: 64px;
    }

    h1 {
      margin-top: 44px;
      font-family: Montserrat, Arial, sans-serif;
      font-size: 50px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    h1 .soft {
      color: #8b929a;
      font-weight: 500;
    }

    .chips {
      display: flex;
      gap: 12px;
      margin-top: 44px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: #dcdedf;
      font-size: 19px;
      font-weight: 500;
    }

    .chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a9fff;
      box-shadow: 0 0 10px #1a9fff;
    }

    .panel {
      position: absolute;
      z-index: 1;
      top: 70px;
      left: 775px;
      width: 420px;
      height: 500px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 40px 90px rgba(0, 0, 0, 0.65),
        0 0 120px rgba(26, 159, 255, 0.18);
    }

    .panel img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Fade the cropped bottom edge of the panel into the background. */
    .panel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: linear-gradient(180deg, transparent, #0c1016);
    }
  </style>
</head>
<body>
  <div class="rings"><span></span><span></span><span></span></div>

  <div class="copy">
    <div class="brand"><img src="../../site/logo.svg" alt="">DeckPad</div>
    <h1>Your Steam Deck,<br><span class="soft">now a Bluetooth controller.</span></h1>
    <div class="chips">
      <span class="chip">Decky plugin</span>
      <span class="chip">PC, phone, tablet</span>
      <span class="chip">No Host software</span>
    </div>
  </div>

  <div class="panel">
    <img src="../screenshots/qam-connected.png" alt="">
  </div>
</body>
</html>
